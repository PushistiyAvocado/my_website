<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Проверка вёрстки каталога на узком экране</title>
  <style>
    html, body { margin: 0; background: #2b2b2b; }
    /* headless Chrome не даёт окно уже ~500px, поэтому мобильную вёрстку смотрим в iframe шириной 390 */
    iframe { display: block; width: 390px; height: 2600px; border: 0; background: #fff; }
  </style>
</head>
<body>
  <iframe id="frame" src="../prototype/catalog.html" title="catalog.html на 390px"></iframe>
</body>
</html>
