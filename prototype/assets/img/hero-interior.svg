<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Демонстрационное изображение: светлая гостиная с панорамными окнами</title>
  <desc id="d">Плоская иллюстрация-заглушка в палитре сайта. Заменяется реальной фотографией объекта.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#efeae0"/>
  <rect width="1600" height="640" fill="#f3efe7"/>
  <rect y="640" width="1600" height="260" fill="#ded5c5"/>

  <!-- Панорамное окно -->
  <g>
    <rect x="760" y="80" width="720" height="530" fill="url(#sky)" stroke="#173b36" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M760 610V80M1120 80v530M760 345h720" stroke="#173b36" stroke-opacity="0.24" stroke-width="2" fill="none"/>
    <!-- городской силуэт -->
    <g fill="#173b36" opacity="0.12">
      <rect x="800" y="430" width="70" height="180"/>
      <rect x="885" y="380" width="52" height="230"/>
      <rect x="955" y="470" width="86" height="140"/>
      <rect x="1160" y="410" width="64" height="200"/>
      <rect x="1240" y="455" width="96" height="155"/>
      <rect x="1350" y="395" width="58" height="215"/>
      <rect x="1420" y="480" width="40" height="130"/>
    </g>
  </g>

  <!-- Свет из окна на пол -->
  <path d="M760 610h720v120L980 795H520z" fill="url(#light)"/>

  <!-- Диван -->
  <g>
    <rect x="150" y="470" width="470" height="150" rx="18" fill="#c9bfad"/>
    <rect x="175" y="430" width="200" height="70" rx="14" fill="#d6cdbd"/>
    <rect x="395" y="430" width="200" height="70" rx="14" fill="#d6cdbd"/>
    <rect x="130" y="600" width="510" height="26" rx="10" fill="#b7ab97"/>
    <rect x="180" y="626" width="16" height="46" fill="#8f826d"/>
    <rect x="574" y="626" width="16" height="46" fill="#8f826d"/>
    <rect x="250" y="486" width="90" height="90" rx="12" fill="#c68a68" opacity="0.75"/>
    <rect x="470" y="500" width="80" height="76" rx="12" fill="#173b36" opacity="0.18"/>
  </g>

  <!-- Журнальный столик -->
  <g>
    <ellipse cx="470" cy="700" rx="150" ry="34" fill="#e6dfd1"/>
    <ellipse cx="470" cy="692" rx="150" ry="34" fill="#f2ede3" stroke="#173b36" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M410 700v-6M530 700v-6" stroke="#8f826d" stroke-width="6" stroke-linecap="round"/>
    <rect x="432" y="664" width="76" height="10" rx="4" fill="#c68a68" opacity="0.8"/>
  </g>

  <!-- Растение -->
  <g stroke="#173b36" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M1330 700c-6-90 10-140 40-180"/>
    <path d="M1330 640c-40-30-60-70-58-110 34 10 58 46 58 110z" fill="#173b36" fill-opacity="0.12"/>
    <path d="M1338 590c30-44 66-60 98-62-8 42-42 68-98 62z" fill="#173b36" fill-opacity="0.12"/>
    <path d="M1332 660c-42-8-72-30-84-62 40-4 72 18 84 62z" fill="#173b36" fill-opacity="0.12"/>
  </g>
  <path d="M1290 700h84l-12 96h-60z" fill="#c68a68" opacity="0.85"/>

  <!-- Торшер -->
  <g stroke="#173b36" stroke-opacity="0.4" stroke-width="3" fill="none">
    <path d="M690 700V470"/>
    <path d="M640 470h100l-22-60h-56z" fill="#f7f4ee"/>
  </g>

  <!-- Подпись -->
  <g>
    <rect x="40" y="820" width="360" height="44" rx="6" fill="#173b36" opacity="0.06"/>
    <text x="60" y="848" font-family="Manrope, Segoe UI, sans-serif" font-size="17" letter-spacing="2.4" fill="#173b36" fill-opacity="0.62">ДЕМОНСТРАЦИОННОЕ ИЗОБРАЖЕНИЕ</text>
  </g>
</svg>
